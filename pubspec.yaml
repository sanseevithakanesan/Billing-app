
name: billing_app
description: தமிழ் billing mobile app with barcode
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.2.6
  font_awesome_flutter: ^10.4.0

  
  mobile_scanner: ^5.2.3       # Barcode scanner
  http: ^1.2.0                 # API தொடர்பு
  provider: ^6.1.2             # State management
  intl: 0.20.2                # நாணய / தேதி format
  share_plus: ^9.0.0           # WhatsApp பகிர்வு


  flutter_secure_storage: ^9.2.2 # பாதுகாப்பான token சேமிப்பு
  shared_preferences: ^2.3.2   # எளிய settings சேமிப்பு


  cached_network_image: ^3.3.1  # தயாரிப்பு படங்கள்
  flutter_spinkit: ^5.2.1      # Loading spinner

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  

  flutter_localizations:
    sdk: flutter
# flutter:
#   uses-material-design: true
#   assets:
#     - assets/images/logo.png
#     - assets/images/background.jpg
#     - assets/fonts/your-font.ttf

  pdf: ^3.10.8
  path_provider: ^2.1.2
  webview_flutter: ^4.8.0